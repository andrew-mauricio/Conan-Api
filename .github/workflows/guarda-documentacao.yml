# Segunda camada da guarda de documentacao: roda no servidor do GitHub, e por
# isso pega tambem o commit feito em clone que nunca instalou o hook local
# (core.hooksPath e por clone, nao viaja com o repositorio). Foi assim que a
# documentacao sumiu em 18/08/2026 -- por um processo de publicacao, nao por
# alguem digitando 'git rm'.
name: Guarda de documentacao

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar documentacao protegida
        run: |
          sh .githooks/verificar-documentacao.sh
          estado=$?
          # Sem pipe: pipe apaga o status de saida e a guarda passaria sempre.
          exit $estado
