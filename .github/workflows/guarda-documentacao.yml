# Segunda camada da guarda de documentacao: roda no servidor do GitHub, e por
# isso pega tambem o commit feito em clone que nunca instalou o hook local
# (core.hooksPath e por clone, nao viaja com o repositorio) e o commit feito
# por script de publicacao automatica. Foi assim que a documentacao sumiu nas
# v1.1.0 e v1.9.0 -- nenhuma das duas por alguem digitando 'git rm'.
name: Guarda de documentacao

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A propria guarda ja sumiu junto com a documentacao uma vez: o workflow
      # foi preservado e o script que ele chama, nao. Sem esta checagem o erro
      # seria um 'No such file' cru, que nao diz o que fazer.
      - name: Conferir que a guarda existe
        run: |
          if [ ! -f .githooks/verificar-documentacao.sh ]; then
            echo "::error::NAO VERIFICOU -- .githooks/verificar-documentacao.sh sumiu do repositorio."
            echo "::error::A guarda nao pode rodar. Restaure .githooks/ (veja CLAUDE.md)."
            exit 2
          fi

      - name: Verificar documentacao protegida
        # Sem pipe: pipe apaga o status de saida e a guarda passaria sempre.
        run: sh .githooks/verificar-documentacao.sh
